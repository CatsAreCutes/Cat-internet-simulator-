<style>
* {

}

html,
body {

body {

.browser {

.body {

.notice {

</head>

<script>

/* =====================================================
   STATE
===================================================== */

let suspicion = 0;

let history = [
    "cat://home"
];

let historyIndex = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const content =
    document.getElementById("content");

const address =
    document.getElementById("address");

const suspicionFill =
    document.getElementById("suspicionFill");

const suspicionText =
    document.getElementById("suspicionText");

const gameOver =
    document.getElementById("gameOver");


/* =====================================================
   NAVIGATION
===================================================== */

function navigate(url) {

    if (
        history[history.length - 1] !== url
    ) {

        history =
            history.slice(
                0,
                historyIndex + 1
            );

        history.push(url);

        historyIndex =
            history.length - 1;
    }

    address.value = url;
}


function goBack() {

    if (historyIndex <= 0)
        return;

    historyIndex--;

    const url =
        history[historyIndex];

    address.value = url;

    renderURL(url);
}


function goHome() {

    navigate("cat://home");

    renderHome();
}


function reloadPage() {

    renderURL(
        address.value
    );
}


function goAddress() {

    const url =
        address.value.trim();

    if (!url)
        return;

    navigate(url);

    renderURL(url);
}


function addressKey(event) {

    if (event.key === "Enter") {
        goAddress();
    }
}


/* =====================================================

/* =====================================================
   CAT.AI
===================================================== */

function showCatAI() {

    navigate("cat://cat.ai");

    content.innerHTML = `

        <div class="chat">

            <div class="chat-title">
                🐈 Cat.AI — ONLINE
            </div>


            <div
                id="chatMessages"
                class="chat-messages">

                <div class="message cat">

                    🐈 Cat.AI:

                    <br><br>

                    Meow. You have entered
                    the Cat Internet.

                    <br><br>

                    What do you want?

                </div>

            </div>


            <div class="chat-input">

                <input
                    id="catInput"
                    type="text"
                    placeholder="Talk to Cat.AI..."
                    autocomplete="off"
                >

                <button
                    id="sendButton"
                    onclick="sendCatMessage()">

                    SEND

                </button>

            </div>

        </div>

    `;


    const input =
        document.getElementById(
            "catInput"
        );


    input.addEventListener(
        "keydown",
        event => {

            if (event.key === "Enter") {
                sendCatMessage();
            }

        }
    );


    input.focus();
}


/* =====================================================
   CAT.AI CHAT
===================================================== */

async function sendCatMessage() {

    const input =
        document.getElementById(
            "catInput"
        );

    const messages =
        document.getElementById(
            "chatMessages"
        );

    const button =
        document.getElementById(
            "sendButton"
        );


    const text =
        input.value.trim();


    if (!text)
        return;


    addMessage(
        "You: " + text,
        "user"
    );


    input.value = "";

    button.disabled = true;


    const thinking =
        document.createElement("div");

    thinking.className =
        "message cat";

    thinking.textContent =
        "🐈 Cat.AI is thinking...";

    messages.appendChild(
        thinking
    );


    messages.scrollTop =
        messages.scrollHeight;


    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message: text
                        })
                }
            );


        const data =
            await response.json();


        thinking.remove();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Cat.AI server error."
            );

        }


        addMessage(
            "🐈 Cat.AI: " +
            data.reply,
            "cat"
        );


    } catch (error) {

        thinking.remove();

        addMessage(
            "🐈 Cat.AI ERROR: " +
            error.message,
            "cat"
        );

    }


    button.disabled = false;

    input.focus();
}


function addMessage(text, type) {

    const messages =
        document.getElementById(
            "chatMessages"
        );


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " + type;

    message.textContent =
        text;


    messages.appendChild(
        message
    );


    messages.scrollTop =
        messages.scrollHeight;
}

function showSearch() {

    content.innerHTML = `

                <br><br>

                I'll answer it.

        </div>

    `;


    const input =
        document.getElementById(
            "searchInput"

                performSearch();

/* =====================================================
   SEARCH TALKS DIRECTLY TO CAT.AI
===================================================== */

async function performSearch() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const responseBox =
        document.getElementById(
            "searchResponse"
        );

    const button =
        document.getElementById(
            "searchButton"
        );


    const query =
        input.value.trim();


    if (!query)
        return;


    /*
       HUMAN SUSPICION
    */

    const lower =
        query.toLowerCase();


    if (
        lower.includes("human") ||
        lower.includes("person") ||
        lower.includes("people")
    ) {

        increaseSuspicion(15);

    }


    if (
        lower.includes("shoe") ||
        lower.includes("shoes")
    ) {

        increaseSuspicion(5);

    }


    button.disabled = true;


    responseBox.textContent =
        "🐈 Cat.AI is thinking...";


    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    /*
                       IMPORTANT:

                       The search is NOT asking
                       for JSON.

                       It is simply sending the
                       user's search directly
                       to Cat.AI.

                       That means Cat.AI can
                       answer exactly like the
                       original Cat.AI.
                    */

                    body:
                        JSON.stringify({
                            message: query
                        })
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Cat.AI search failed."
            );

        }


        responseBox.innerHTML =
            `<span class="cat-name">
                🐈 Cat.AI:
            </span>

            <br><br>` +
            escapeHTML(
                data.reply
            );


    } catch (error) {

        responseBox.innerHTML =
            `<span class="cat-name">
                🐈 Cat.AI:
            </span>

            <br><br>

            Something went wrong.

            <br><br>

            ${escapeHTML(
                error.message
            )}`;

    }


    button.disabled = false;

    input.focus();
}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =====================================================
   SUSPICION
===================================================== */

function increaseSuspicion(amount) {

    suspicion += amount;


    if (suspicion > 100) {
        suspicion = 100;
    }


    suspicionFill.style.width =
        suspicion + "%";


    suspicionText.textContent =
        suspicion + "%";


    if (suspicion >= 100) {

        gameOver.classList.add(
            "show"
        );

    }
}


/* =====================================================
   RESTART
===================================================== */

function restartGame() {

    suspicion = 0;

    suspicionFill.style.width =
        "0%";

    suspicionText.textContent =
        "0%";

    gameOver.classList.remove(
        "show"
    );

    goHome();
}


/* =====================================================
   URL RENDERING
===================================================== */

function renderURL(url) {

    if (url === "cat://home") {
        renderHome();
    }

    else if (url === "cat://cat.ai") {
        showCatAI();
    }

    else if (url === "cat://search") {
        showSearch();
    }

    else if (url === "cat://cats") {
        showCats();
    }

    else if (url === "cat://news") {
        showNews();
    }

    else if (url === "cat://about") {
        showAbout();
    }

    else {
        renderHome();
    }
}


/* =====================================================
   START
===================================================== */

renderHome();

</script>
