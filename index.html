<title>

<style>

/* =====================================================
   OLD INTERNET / BROWSER STYLE
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {

    background: #008080;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    font-size: 13px;

    overflow: hidden;
}


/* =====================================================
   BROWSER
===================================================== */

.browser {

    width: 100vw;
    height: 100vh;

    display: flex;
    flex-direction: column;

    background: #c0c0c0;

    border: 3px outset white;
}


/* =====================================================
   TITLE BAR
===================================================== */

.titlebar {

    height: 30px;

    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding: 3px 6px;

    color: white;

    background:
        linear-gradient(
            to right,
            #000080,
            #1084d0
        );

    font-weight: bold;
}

.title-buttons {

    margin-left: auto;
}

.title-buttons button {

    width: 23px;
    height: 21px;

    padding: 0;

    margin-left: 2px;

    border: 2px outset white;

    background: #c0c0c0;

    font-weight: bold;
}


/* =====================================================
   TOOLBAR
===================================================== */

.toolbar {

    min-height: 38px;

    display: flex;
    align-items: center;

    gap: 4px;

    padding: 4px;

    border-bottom: 2px inset white;
}

.toolbar button {

    height: 27px;

    padding: 3px 8px;

    border: 2px outset white;

    background: #c0c0c0;

    cursor: pointer;
}

.toolbar button:active {

    border-style: inset;
}

.address {

    flex: 1;

    height: 27px;

    padding: 3px 6px;

    border: 2px inset white;

    background: white;

    font-family:
        "Courier New",
        monospace;

    font-size: 12px;
}


/* =====================================================
   MAIN PAGE
===================================================== */

.page {

    flex: 1;

    min-height: 0;

    display: flex;

    background: white;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {

    width: 175px;

    flex-shrink: 0;

    padding: 6px;

    border-right: 3px ridge white;

    background: #d4d0c8;

    overflow-y: auto;
}

.sidebar-title {

    padding: 6px;

    color: white;

    background: #000080;

    text-align: center;

    font-weight: bold;
}

.side-button {

    width: 100%;

    margin-top: 5px;

    padding: 6px;

    border: 2px outset white;

    background: #c0c0c0;

    text-align: left;

    cursor: pointer;

    font-size: 12px;
}

.side-button:active {

    border-style: inset;
}


/* =====================================================
   STATUS
===================================================== */

.status {

    margin-top: 9px;

    padding: 7px;

    border: 2px inset white;

    background: white;

    font-size: 11px;
}


/* =====================================================
   SUSPICION
===================================================== */

.suspicion {

    margin-top: 8px;

    padding: 7px;

    border: 2px inset white;

    background: #ffffcc;

    font-size: 11px;
}

.suspicion-bar {

    height: 13px;

    margin-top: 4px;

    border: 2px inset white;

    background: white;
}

.suspicion-fill {

    width: 0%;

    height: 100%;

    background: red;
}


/* =====================================================
   CONTENT
===================================================== */

.content {

    flex: 1;

    min-width: 0;
    min-height: 0;

    overflow: auto;

    background: white;
}


/* =====================================================
   HEADER
===================================================== */

.header {

    padding: 10px;

    color: white;

    background:
        linear-gradient(
            90deg,
            #000080,
            #800080,
            #000080
        );

    border-bottom: 3px ridge white;
}

.header h1 {

    margin: 0 0 3px 0;

    font-family: Georgia, serif;

    font-size: 24px;
}


/* =====================================================
   BODY
===================================================== */

.body {

    padding: 12px;
}

.notice {

    padding: 8px;

    margin-bottom: 12px;

    border: 2px dashed #800080;

    background: #ffffcc;
}


/* =====================================================
   CARDS
===================================================== */

.cards {

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(180px, 1fr)
        );

    gap: 10px;
}

.card {

    min-height: 120px;

    padding: 10px;

    border: 3px outset #eee;

    background: #e8e8e8;
}

.card h2 {

    margin: 5px 0;

    color: #000080;

    font-size: 17px;
}

.card button {

    padding: 5px 10px;

    border: 2px outset white;

    background: #c0c0c0;

    cursor: pointer;
}

.cat {

    font-size: 35px;

    text-align: center;
}


/* =====================================================
   SEARCH PAGE
===================================================== */

.search-page {

    padding: 10px;
}

.search-header {

    padding: 7px;

    color: white;

    background: #000080;

    font-weight: bold;
}

.search-box {

    padding: 9px;

    background: #d4d0c8;

    border-bottom: 2px solid #808080;
}

.search-box input {

    width:
        calc(100% - 75px);

    height: 26px;

    padding: 3px 6px;

    border: 2px inset white;

    font-family:
        "Courier New",
        monospace;

    font-size: 12px;
}

.search-box button {

    height: 26px;

    padding: 3px 10px;

    border: 2px outset white;

    background: #c0c0c0;

    cursor: pointer;
}


/* =====================================================
   AI SEARCH RESULTS
===================================================== */

.search-results {

    padding: 5px 10px;
}

.search-status {

    padding: 6px;

    margin-bottom: 10px;

    background: #eeeeee;

    border: 1px inset white;

    font-family:
        "Courier New",
        monospace;

    font-size: 11px;
}

.result {

    margin: 14px 0;

    padding-bottom: 10px;

    border-bottom: 1px solid #cccccc;
}

.result-title {

    color: #0000ee;

    text-decoration: underline;

    font-size: 16px;

    cursor: pointer;
}

.result-url {

    color: #008000;

    font-size: 11px;

    margin-top: 2px;
}

.result p {

    margin: 4px 0;

    line-height: 1.3;
}


/* =====================================================
   CHAT
===================================================== */

.chat {

    height: 100%;

    display: flex;

    flex-direction: column;

    background: #d4d0c8;
}

.chat-title {

    padding: 7px;

    color: white;

    background: #800080;

    font-weight: bold;
}

.chat-messages {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 8px;

    background: #111;

    color: white;

    border: 3px inset white;

    font-family:
        "Courier New",
        monospace;

    font-size: 12px;
}

.message {

    margin: 7px 0;

    padding: 6px;

    border: 1px solid #555;

    white-space: pre-wrap;

    line-height: 1.3;
}

.message.user {

    color: #ffff66;
}

.message.cat {

    color: #66ff99;
}

.chat-input {

    display: flex;

    gap: 4px;

    padding: 5px;
}

.chat-input input {

    flex: 1;

    min-width: 0;

    height: 27px;

    padding: 4px;

    border: 2px inset white;

    font-family:
        "Courier New",
        monospace;

    font-size: 12px;
}

.chat-input button {

    height: 27px;

    padding: 3px 12px;

    border: 2px outset white;

    background: #c0c0c0;

    cursor: pointer;
}


/* =====================================================
   GAME OVER
===================================================== */

.game-over {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: none;

    align-items: center;

    justify-content: center;

    background: black;

    color: red;

    text-align: center;
}

.game-over.show {

    display: flex;
}

.game-box {

    width: min(600px, 90%);

    padding: 30px;

    border: 5px double red;

    background: #080808;

    box-shadow:
        0 0 40px red;
}

.game-box .big-cat {

    font-size: 60px;
}

.game-box h1 {

    font-size: 36px;
}

.game-box p {

    color: white;
}

.restart {

    padding: 8px 20px;

    border: 3px outset white;

    background: #c0c0c0;

    cursor: pointer;
}


@media(max-width:700px) {

    .sidebar {

        display: none;
    }

}

</style>

</head>

<script>


/* =====================================================
   STATE
===================================================== */

let suspicion = 0;

let history = [
    "cat://home"
];

let historyIndex = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const content =
    document.getElementById(
        "content"
    );

const address =
    document.getElementById(
        "address"
    );

const suspicionFill =
    document.getElementById(
        "suspicionFill"
    );

const suspicionText =
    document.getElementById(
        "suspicionText"
    );

const gameOver =
    document.getElementById(
        "gameOver"
    );


/* =====================================================
   NAVIGATION
===================================================== */

function navigate(url) {

    if (
        history[
            history.length - 1
        ] !== url
    ) {

        history =
            history.slice(
                0,
                historyIndex + 1
            );

        history.push(url);

        historyIndex =
            history.length - 1;

    }

    address.value = url;

}


function goBack() {

    if (
        historyIndex <= 0
    )
        return;

    historyIndex--;

    const url =
        history[
            historyIndex
        ];

    address.value = url;

    renderURL(url);

}


function goHome() {

    navigate(
        "cat://home"
    );

    renderHome();

}


function reloadPage() {

    renderURL(
        address.value
    );

}


function goAddress() {

    const url =
        address.value.trim();

    if (!url)
        return;

    navigate(url);

    renderURL(url);

}


function addressKey(event) {

    if (
        event.key === "Enter"
    ) {

        goAddress();

    }

}

}


/* =====================================================
   REAL CAT.AI
===================================================== */

function showCatAI() {

    navigate(
        "cat://cat.ai"
    );


    content.innerHTML = `

        <div class="chat">


            <div class="chat-title">

                🐈 Cat.AI — ONLINE

            </div>


            <div
                id="chatMessages"
                class="chat-messages">


                <div class="message cat">

                    🐈 Cat.AI:

                    <br><br>

                    Meow. You have entered
                    the Cat Internet.

                    <br><br>

                    What do you want?

                </div>


            </div>


            <div class="chat-input">

                <input
                    id="catInput"
                    type="text"
                    placeholder="Talk to Cat.AI..."
                    autocomplete="off"
                >

                <button
                    id="sendButton"
                    onclick="sendCatMessage()">

                    SEND

                </button>

            </div>


        </div>

    `;


    const input =
        document.getElementById(
            "catInput"
        );


    input.addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter"
            ) {

                sendCatMessage();

            }

        }
    );


    input.focus();

}


/* =====================================================
   REAL CAT.AI CHAT REQUEST
===================================================== */

async function sendCatMessage() {

    const input =
        document.getElementById(
            "catInput"
        );

    const messages =
        document.getElementById(
            "chatMessages"
        );

    const sendButton =
        document.getElementById(
            "sendButton"
        );


    if (
        !input ||
        !messages
    )
        return;


    const text =
        input.value.trim();


    if (!text)
        return;


    addMessage(
        "You: " + text,
        "user"
    );


    input.value = "";

    sendButton.disabled = true;


    const thinking =
        document.createElement(
            "div"
        );


    thinking.className =
        "message cat";


    thinking.textContent =
        "🐈 Cat.AI is thinking...";


    messages.appendChild(
        thinking
    );


    messages.scrollTop =
        messages.scrollHeight;


    try {

        const response =
            await fetch(
                "/api/chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({
                            message: text
                        })

                }
            );


        const data =
            await response.json();


        thinking.remove();


        if (
            !response.ok
        ) {

            throw new Error(
                data.error ||
                "Cat.AI server error."
            );

        }


        addMessage(
            "🐈 Cat.AI: " +
            data.reply,
            "cat"
        );


    }
    catch (error) {

        thinking.remove();


        addMessage(
            "🐈 Cat.AI ERROR: " +
            error.message,
            "cat"
        );


        console.error(
            error
        );

    }


    sendButton.disabled = false;

    input.focus();

}


/* =====================================================
   CHAT MESSAGE
===================================================== */

function addMessage(
    text,
    type
) {

    const messages =
        document.getElementById(
            "chatMessages"
        );


    if (!messages)
        return;


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "message " + type;


    message.textContent =
        text;


    messages.appendChild(
        message
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* =====================================================
   AI CAT SEARCH PAGE
===================================================== */

                    <b>
                        dragons
                    </b>

                    <b>

                    </b>

                </p>

    `;

        );

/* =====================================================
   AI SEARCH
===================================================== */

async function performSearch() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const results =
        document.getElementById(
            "searchResults"
        );

    const button =
        document.getElementById(
            "searchButton"
        );


    if (
        !input ||
        !results ||
        !button
    )
        return;


    const query =
        input.value.trim();


    if (!query)
        return;


    /*
       HUMAN SUSPICION
    */

    const lower =
        query.toLowerCase();


    if (
        lower.includes("human") ||
        lower.includes("person") ||
        lower.includes("people")
    ) {

        increaseSuspicion(15);

    }


    /*
       SHOES ARE SUSPICIOUS
    */

    if (
        lower.includes("shoe") ||
        lower.includes("shoes")
    ) {

        increaseSuspicion(5);

    }


    button.disabled = true;


    results.innerHTML = `

        <div class="search-status">

            🐈 Cat Search is searching...

            <br><br>

            Asking the cats...

        </div>

    `;


    /*
       THIS IS THE IMPORTANT PART:

       The search itself talks to Cat.AI.

       It uses the SAME /api/chat endpoint
       that the normal Cat.AI chat uses.
    */

    const searchPrompt = `

You are powering the fake search engine
inside Cat Internet Simulator.

The user searched for:

"${query}"

Generate fake search-engine results for
this exact search.

IMPORTANT:

- This is a fictional cat internet.
- Do NOT give ordinary Google-style real-world results.
- Make the results feel like websites that
  exist inside the Cat Internet Simulator.
- Results can be silly, strange, suspicious,
  useful, or cat-related depending on the search.
- If the search involves shoes, cats should
  be suspicious of them.
- If the user searches for humans, cats should
  become suspicious.
- Do not pretend these fake websites are real.
- Keep it reasonably concise.

Return ONLY valid JSON.

Use exactly this structure:

{
  "results": [
    {
      "title": "result title",
      "url": "cat://example",
      "description": "short result description"
    }
  ]
}

Return between 3 and 5 results.

`;


    try {

        const response =
            await fetch(
                "/api/chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                searchPrompt

                        })

                }
            );


        const data =
            await response.json();


        if (
            !response.ok
        ) {

            throw new Error(
                data.error ||
                "Cat Search server error."
            );

        }


        let aiText =
            data.reply;


        /*
           Remove markdown code fences
           if the AI accidentally adds them.
        */

        aiText =
            aiText
                .replace(
                    /^```json\s*/i,
                    ""
                )
                .replace(
                    /^```\s*/i,
                    ""
                )
                .replace(
                    /\s*```$/i,
                    ""
                )
                .trim();


        let searchData;


        try {

            searchData =
                JSON.parse(
                    aiText
                );

        }
        catch {

            /*
               If the AI didn't return perfect JSON,
               show its response rather than crashing.
            */

            results.innerHTML = `

                <div class="search-status">

                    🐈 Cat Search found something weird.

                </div>


                <div class="result">

                    <div class="result-title">

                        Cat Internet Result

                    </div>

                    <div class="result-url">

                        cat://ai-result

                    </div>

                    <p>

                        ${escapeHTML(aiText)}

                    </p>

                </div>

            `;

            return;

        }


        if (
            !searchData.results ||
            !Array.isArray(
                searchData.results
            )
        ) {

            throw new Error(
                "Cat Search received invalid results."
            );

        }


        /*
           BUILD THE RESULTS PAGE
        */

        results.innerHTML = `

            <div class="search-status">

                Search results for:

                <b>
                    ${escapeHTML(query)}
                </b>

                <br>

                Cat Internet Search found
                ${searchData.results.length}
                results.

            </div>

        `;


        for (
            const result of
            searchData.results
        ) {

            const resultElement =
                document.createElement(
                    "div"
                );


            resultElement.className =
                "result";


            const title =
                escapeHTML(
                    result.title ||
                    "Untitled Cat Result"
                );


            const url =
                escapeHTML(
                    result.url ||
                    "cat://unknown"
                );


            const description =
                escapeHTML(
                    result.description ||
                    "No description."
                );


            resultElement.innerHTML = `

                <div class="result-title">

                    ${title}

                </div>


                <div class="result-url">

                    ${url}

                </div>


                <p>

                    ${description}

                </p>

            `;


            results.appendChild(
                resultElement
            );

        }


    }
    catch (error) {

        results.innerHTML = `

            <div class="search-status">

                🐈 CAT SEARCH ERROR

            </div>


            <div class="result">

                <div class="result-title">

                    The cats broke the search engine.

                </div>


                <div class="result-url">

                    cat://error

                </div>


                <p>

                    ${escapeHTML(
                        error.message
                    )}

                </p>

            </div>

        `;


        console.error(
            "Cat Search error:",
            error
        );

    }


    button.disabled = false;

    input.focus();

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(text) {

    return String(text)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

/* =====================================================
   SUSPICION
===================================================== */

function increaseSuspicion(amount) {

    suspicion += amount;


    if (
        suspicion > 100
    ) {

        suspicion = 100;

    }


    suspicionFill.style.width =
        suspicion + "%";


    suspicionText.textContent =
        suspicion + "%";


    if (
        suspicion >= 100
    ) {

        gameOver.classList.add(
            "show"
        );

    }

}


/* =====================================================
   RESTART
===================================================== */

function restartGame() {

    suspicion = 0;


    suspicionFill.style.width =
        "0%";


    suspicionText.textContent =
        "0%";


    gameOver.classList.remove(
        "show"
    );


    goHome();

}


/* =====================================================
   URL RENDERING
===================================================== */

function renderURL(url) {

    if (
        url === "cat://home"
    ) {

        renderHome();

    }

    else if (
        url === "cat://cat.ai"
    ) {

        showCatAI();

    }

    else if (
        url === "cat://search"
    ) {

        showSearch();

    }

    else if (
        url === "cat://cats"
    ) {

        showCats();

    }

    else if (
        url === "cat://news"
    ) {

        showNews();

    }

    else if (
        url === "cat://about"
    ) {

        showAbout();

    }

    else {

        renderHome();

    }

}
