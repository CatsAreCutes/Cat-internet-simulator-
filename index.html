<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cat Internet Simulator</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    background: #008080;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

.browser {
    width: 100vw;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #c0c0c0;
    border: 3px outset white;
}

.titlebar {
    height: 34px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 4px 8px;
    color: white;
    background: linear-gradient(to right, #000080, #1084d0);
    font-family: Arial, sans-serif;
    font-weight: bold;
}

.title-buttons {
    margin-left: auto;
}

.title-buttons button {
    width: 25px;
    height: 22px;
    padding: 0;
    margin-left: 2px;
    border: 2px outset white;
    background: #c0c0c0;
    font-weight: bold;
}

.toolbar {
    min-height: 44px;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px;
    border-bottom: 2px inset white;
}

.toolbar button {
    height: 30px;
    padding: 4px 10px;
    border: 2px outset white;
    background: #c0c0c0;
    cursor: pointer;
}

.address {
    flex: 1;
    height: 29px;
    padding: 4px 7px;
    border: 2px inset white;
    background: white;
    font-family: "Courier New", monospace;
}

.page {
    flex: 1;
    min-height: 0;
    display: flex;
    background: white;
}

.sidebar {
    width: 185px;
    flex-shrink: 0;
    padding: 8px;
    border-right: 3px ridge white;
    background: #d4d0c8;
    overflow-y: auto;
}

.sidebar-title {
    padding: 7px;
    color: white;
    background: #000080;
    text-align: center;
    font-weight: bold;
}

.side-button {
    width: 100%;
    margin-top: 7px;
    padding: 8px;
    border: 2px outset white;
    background: #c0c0c0;
    text-align: left;
    cursor: pointer;
}

.side-button:active,
.toolbar button:active {
    border-style: inset;
}

.status {
    margin-top: 12px;
    padding: 8px;
    border: 2px inset white;
    background: white;
    font-size: 12px;
}

.suspicion {
    margin-top: 10px;
    padding: 8px;
    border: 2px inset white;
    background: #ffffcc;
    font-size: 12px;
}

.suspicion-bar {
    height: 15px;
    margin-top: 5px;
    border: 2px inset white;
    background: white;
}

.suspicion-fill {
    width: 0%;
    height: 100%;
    background: red;
}

.content {
    flex: 1;
    min-width: 0;
    min-height: 0;
    overflow: auto;
    background: white;
}

.header {
    padding: 14px;
    color: white;
    background: linear-gradient(90deg, #000080, #800080, #000080);
    border-bottom: 4px ridge white;
}

.header h1 {
    margin: 0;
    font-family: Georgia, serif;
}

.body {
    padding: 18px;
}

.notice {
    padding: 10px;
    margin-bottom: 15px;
    border: 2px dashed #800080;
    background: #ffffcc;
}

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
    gap: 15px;
}

.card {
    min-height: 150px;
    padding: 13px;
    border: 3px outset #eee;
    background: #e8e8e8;
}

.card h2 {
    margin-top: 0;
    color: #000080;
}

.card button {
    padding: 7px 12px;
    border: 2px outset white;
    background: #c0c0c0;
    cursor: pointer;
}

.cat {
    font-size: 60px;
    text-align: center;
}

.footer {
    margin-top: 25px;
    padding: 8px;
    border-top: 2px solid #808080;
    font-size: 11px;
    text-align: center;
}

/* CHAT */

.chat {
    height: 100%;
    display: flex;
    flex-direction: column;
    background: #d4d0c8;
}

.chat-title {
    padding: 8px;
    color: white;
    background: #800080;
    font-weight: bold;
}

.chat-messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 10px;
    background: #111;
    color: white;
    border: 3px inset white;
}

.message {
    margin: 8px 0;
    padding: 8px;
    border: 1px solid #555;
    white-space: pre-wrap;
}

.message.user {
    color: #ffff66;
}

.message.cat {
    color: #66ff99;
}

.chat-input {
    display: flex;
    gap: 5px;
    padding: 7px;
}

.chat-input input {
    flex: 1;
    min-width: 0;
    padding: 8px;
    border: 2px inset white;
    font-family: "Courier New", monospace;
}

.chat-input button {
    padding: 8px 15px;
    border: 2px outset white;
    background: #c0c0c0;
    cursor: pointer;
}

/* SEARCH */

.search-area {
    padding: 15px;
    background: #e8e8e8;
    border-bottom: 2px solid #808080;
}

.search-area input {
    width: 70%;
    padding: 8px;
    border: 2px inset white;
}

.search-area button {
    padding: 8px 12px;
    border: 2px outset white;
    background: #c0c0c0;
}

.result {
    margin: 18px;
}

.result-title {
    color: #0000ee;
    text-decoration: underline;
    font-size: 18px;
    cursor: pointer;
}

/* GAME OVER */

.game-over {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    background: black;
    color: red;
    text-align: center;
}

.game-over.show {
    display: flex;
}

.game-box {
    width: min(650px, 90%);
    padding: 35px;
    border: 5px double red;
    background: #080808;
    box-shadow: 0 0 40px red;
}

.game-box .big-cat {
    font-size: 80px;
}

.game-box h1 {
    font-size: 42px;
}

.game-box p {
    color: white;
}

.restart {
    padding: 10px 25px;
    border: 3px outset white;
    background: #c0c0c0;
    cursor: pointer;
}

@media(max-width:700px) {
    .sidebar {
        display: none;
    }
}
</style>
</head>

<body>

<div class="browser">

    <div class="titlebar">

        🐈 Cat Internet Simulator

        <div class="title-buttons">
            <button>_</button>
            <button>□</button>
            <button>×</button>
        </div>

    </div>


    <div class="toolbar">

        <button onclick="goBack()">◀ Back</button>
        <button onclick="goHome()">🏠 Home</button>
        <button onclick="reloadPage()">⟳</button>

        <input
            id="address"
            class="address"
            value="cat://home"
            onkeydown="addressKey(event)"
        >

        <button onclick="goAddress()">Go</button>

    </div>


    <div class="page">

        <aside class="sidebar">

            <div class="sidebar-title">
                CAT INTERNET
            </div>

            <button
                class="side-button"
                onclick="goHome()">
                🏠 Cat Home
            </button>

            <button
                class="side-button"
                onclick="showSearch()">
                🔎 Cat Search
            </button>

            <button
                class="side-button"
                onclick="showCatAI()">
                🐈 Cat.AI
            </button>

            <button
                class="side-button"
                onclick="openOriginalCatAI()">
                🐈 Original Cat.AI
            </button>

            <button
                class="side-button"
                onclick="showCats()">
                🐱 Cat Pictures
            </button>

            <button
                class="side-button"
                onclick="showNews()">
                📰 Cat News
            </button>

            <button
                class="side-button"
                onclick="showAbout()">
                ℹ️ About
            </button>

            <div class="status">

                <b>CAT.AI STATUS</b>

                <br><br>

                ● ONLINE

                <br>

                ● WATCHING

            </div>

            <div class="suspicion">

                <b>HUMAN SUSPICION</b>

                <div class="suspicion-bar">

                    <div
                        id="suspicionFill"
                        class="suspicion-fill">
                    </div>

                </div>

                <span id="suspicionText">0%</span>

            </div>

        </aside>


        <main
            id="content"
            class="content">
        </main>

    </div>

</div>


<div
    id="gameOver"
    class="game-over">

    <div class="game-box">

        <div class="big-cat">🐈</div>

        <h1>GAME OVER</h1>

        <p>Cat.AI has discovered the truth.</p>

        <p>maybe dont say you are a human lmao</p>

        <p>Good, YOU DIED-</p>

        <p>Meow.</p>

        <button
            class="restart"
            onclick="restartGame()">
            🔄 Restart
        </button>

    </div>

</div>


<script>

/* =====================================================
   STATE
===================================================== */

let suspicion = 0;

let history = [
    "cat://home"
];

let historyIndex = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const content =
    document.getElementById("content");

const address =
    document.getElementById("address");

const suspicionFill =
    document.getElementById("suspicionFill");

const suspicionText =
    document.getElementById("suspicionText");

const gameOver =
    document.getElementById("gameOver");


/* =====================================================
   NAVIGATION
===================================================== */

function navigate(url) {

    if (
        history[history.length - 1] !== url
    ) {

        history =
            history.slice(
                0,
                historyIndex + 1
            );

        history.push(url);

        historyIndex =
            history.length - 1;

    }

    address.value = url;
}


function goBack() {

    if (historyIndex <= 0)
        return;

    historyIndex--;

    const url =
        history[historyIndex];

    address.value = url;

    renderURL(url);
}


function goHome() {

    navigate("cat://home");

    renderHome();
}


function reloadPage() {

    renderURL(address.value);

}


function goAddress() {

    const url =
        address.value.trim();

    if (!url)
        return;

    navigate(url);

    renderURL(url);
}


function addressKey(event) {

    if (event.key === "Enter") {

        goAddress();

    }

}


/* =====================================================
   ORIGINAL CAT.AI
===================================================== */

function openOriginalCatAI() {

    window.location.href =
        "https://cat-ai-xuxu.onrender.com/";

}


/* =====================================================
   HOME
===================================================== */

function renderHome() {

    navigate("cat://home");

    content.innerHTML = `

        <div class="header">

            <h1>
                🐈 CAT INTERNET SIMULATOR
            </h1>

            Welcome to the Internet.
            But cats.

        </div>


        <div class="body">

            <div class="notice">

                ⚠️ IMPORTANT INTERNET NOTICE:

                <br><br>

                This website is approximately
                47% cats and 53% suspicious activity.

            </div>


            <div class="cards">

                <div class="card">

                    <div class="cat">🐈</div>

                    <h2>Cat.AI</h2>

                    <p>
                        Talk to the REAL Cat.AI
                        powered by the server.
                    </p>

                    <button onclick="showCatAI()">
                        ENTER
                    </button>

                </div>


                <div class="card">

                    <div class="cat">🔎</div>

                    <h2>Cat Search</h2>

                    <p>
                        Search the fake Cat Internet.
                    </p>

                    <button onclick="showSearch()">
                        SEARCH
                    </button>

                </div>


                <div class="card">

                    <div class="cat">🐱</div>

                    <h2>Cat Pictures</h2>

                    <p>
                        Extremely important research.
                    </p>

                    <button onclick="showCats()">
                        VIEW CATS
                    </button>

                </div>


                <div class="card">

                    <div class="cat">📰</div>

                    <h2>Cat News</h2>

                    <p>
                        Completely legitimate cat news.
                    </p>

                    <button onclick="showNews()">
                        READ
                    </button>

                </div>

            </div>


            <div class="footer">

                Cat Internet Simulator

                <br>

                The cats know.

            </div>

        </div>
    `;
}


/* =====================================================
   REAL CAT.AI
===================================================== */

function showCatAI() {

    navigate("cat://cat.ai");

    content.innerHTML = `

        <div class="chat">

            <div class="chat-title">

                🐈 Cat.AI — ONLINE

            </div>


            <div
                id="chatMessages"
                class="chat-messages">

                <div class="message cat">

                    🐈 Cat.AI:

                    <br><br>

                    Meow. You have entered
                    the Cat Internet.

                    <br><br>

                    What do you want?

                </div>

            </div>


            <div class="chat-input">

                <input
                    id="catInput"
                    type="text"
                    placeholder="Talk to Cat.AI..."
                    autocomplete="off"
                >

                <button
                    id="sendButton"
                    onclick="sendCatMessage()">

                    SEND

                </button>

            </div>

        </div>
    `;


    const input =
        document.getElementById("catInput");


    input.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {

                sendCatMessage();

            }

        }
    );


    input.focus();

}


/* =====================================================
   REAL AI REQUEST
===================================================== */

async function sendCatMessage() {

    const input =
        document.getElementById("catInput");

    const messages =
        document.getElementById("chatMessages");

    const sendButton =
        document.getElementById("sendButton");


    if (!input || !messages)
        return;


    const text =
        input.value.trim();


    if (!text)
        return;


    /* USER MESSAGE */

    addMessage(
        "You: " + text,
        "user"
    );


    input.value = "";

    sendButton.disabled = true;


    /* THINKING */

    const thinking =
        document.createElement("div");

    thinking.className =
        "message cat";

    thinking.textContent =
        "🐈 Cat.AI is thinking...";

    messages.appendChild(thinking);

    messages.scrollTop =
        messages.scrollHeight;


    try {

        const response =
            await fetch(
                "/api/chat",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            message: text
                        })
                }
            );


        const data =
            await response.json();


        thinking.remove();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Cat.AI server error."
            );

        }


        /* REAL GROQ RESPONSE */

        addMessage(
            "🐈 Cat.AI: " +
            data.reply,
            "cat"
        );


    } catch (error) {

        thinking.remove();


        addMessage(
            "🐈 Cat.AI ERROR: " +
            error.message,
            "cat"
        );


        console.error(
            "Cat.AI error:",
            error
        );

    }


    sendButton.disabled = false;

    input.focus();

}


/* =====================================================
   CHAT MESSAGE
===================================================== */

function addMessage(
    text,
    type
) {

    const messages =
        document.getElementById(
            "chatMessages"
        );


    if (!messages)
        return;


    const message =
        document.createElement("div");


    message.className =
        "message " + type;


    message.textContent =
        text;


    messages.appendChild(
        message
    );


    messages.scrollTop =
        messages.scrollHeight;

}


/* =====================================================
   SEARCH
===================================================== */

function showSearch() {

    navigate("cat://search");

    content.innerHTML = `

        <div class="search-area">

            <h2>🔎 Cat Search</h2>

            <input
                id="searchInput"
                placeholder="Search the Cat Internet..."
            >

            <button onclick="performSearch()">
                SEARCH
            </button>

        </div>


        <div id="searchResults">

            <p style="padding:15px">
                Search for something.
            </p>

        </div>
    `;


    document
        .getElementById("searchInput")
        .addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Enter") {

                    performSearch();

                }

            }
        );

}


/* =====================================================
   SEARCH RESULTS
===================================================== */

function performSearch() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const results =
        document.getElementById(
            "searchResults"
        );


    const query =
        input.value.trim();


    if (!query)
        return;


    const lower =
        query.toLowerCase();


    if (
        lower.includes("human") ||
        lower.includes("person")
    ) {

        increaseSuspicion(10);

    }


    if (
        lower.includes("shoe")
    ) {

        increaseSuspicion(5);

    }


    results.innerHTML = `

        <div class="result">

            <div
                class="result-title"
                onclick="showCatAI()">

                Cat.AI

            </div>

            <p>
                The suspicious AI cat living
                inside the Cat Internet.
            </p>

        </div>


        <div class="result">

            <div
                class="result-title"
                onclick="showCats()">

                Cat Pictures

            </div>

            <p>
                Thousands of cats.
                Probably.
            </p>

        </div>


        <div class="result">

            <div
                class="result-title"
                onclick="showNews()">

                Cat News

            </div>

            <p>
                Breaking news from the feline world.
            </p>

        </div>

    `;

}


/* =====================================================
   CATS
===================================================== */

function showCats() {

    navigate("cat://cats");

    content.innerHTML = `

        <div class="header">

            <h1>🐱 CAT PICTURES</h1>

            Very serious Internet research.

        </div>


        <div class="body">

            <div class="cards">

                <div class="card">

                    <div class="cat">🐈</div>

                    <h2>Cat</h2>

                    <p>Cat.</p>

                </div>


                <div class="card">

                    <div class="cat">🐈‍⬛</div>

                    <h2>Black Cat</h2>

                    <p>Also cat.</p>

                </div>


                <div class="card">

                    <div class="cat">😺</div>

                    <h2>Happy Cat</h2>

                    <p>Extremely happy.</p>

                </div>


                <div class="card">

                    <div class="cat">😼</div>

                    <h2>Suspicious Cat</h2>

                    <p>It knows something.</p>

                </div>

            </div>

        </div>
    `;
}


/* =====================================================
   NEWS
===================================================== */

function showNews() {

    navigate("cat://news");

    content.innerHTML = `

        <div class="header">

            <h1>📰 CAT NEWS NETWORK</h1>

            News from around the Cat Internet.

        </div>


        <div class="body">

            <div class="card">

                <h2>
                    BREAKING: Cat discovers box
                </h2>

                <p>
                    A cat has discovered a cardboard
                    box. Scientists are confused.
                </p>

            </div>


            <br>


            <div class="card">

                <h2>
                    Shoes remain suspicious
                </h2>

                <p>
                    Cat.AI has once again confirmed
                    that shoes are suspicious.
                </p>

            </div>

        </div>
    `;
}


/* =====================================================
   ABOUT
===================================================== */

function showAbout() {

    navigate("cat://about");

    content.innerHTML = `

        <div class="header">

            <h1>ℹ️ ABOUT</h1>

        </div>


        <div class="body">

            <div class="notice">

                <b>Cat Internet Simulator</b>

                <br><br>

                A fictional fake Internet full of cats.

            </div>


            <div class="card">

                <h2>Website History</h2>

                <p>
                    Cat.AI was the original website.
                </p>

                <p>
                    Cat Internet Simulator came second
                    and was based on the original Cat.AI.
                </p>

                <p>
                    The original Cat.AI now lives inside
                    the Cat Internet Simulator.
                </p>

                <button onclick="openOriginalCatAI()">

                    Visit Original Cat.AI

                </button>

            </div>

        </div>
    `;
}


/* =====================================================
   SUSPICION
===================================================== */

function increaseSuspicion(amount) {

    suspicion += amount;

    if (suspicion > 100)
        suspicion = 100;


    suspicionFill.style.width =
        suspicion + "%";

    suspicionText.textContent =
        suspicion + "%";


    if (suspicion >= 100) {

        gameOver.classList.add("show");

    }

}


/* =====================================================
   RESTART
===================================================== */

function restartGame() {

    suspicion = 0;

    suspicionFill.style.width = "0%";

    suspicionText.textContent = "0%";

    gameOver.classList.remove("show");

    goHome();

}


/* =====================================================
   URL
===================================================== */

function renderURL(url) {

    if (url === "cat://home") {

        renderHome();

    } else if (url === "cat://cat.ai") {

        showCatAI();

    } else if (url === "cat://search") {

        showSearch();

    } else if (url === "cat://cats") {

        showCats();

    } else if (url === "cat://news") {

        showNews();

    } else if (url === "cat://about") {

        showAbout();

    } else {

        renderHome();

    }

}


/* =====================================================
   START
===================================================== */

renderHome();

</script>

</body>
</html>
