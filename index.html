/* =========================

========================= */

    padding: 0;

    background: #c0c0c0;

    font-weight: bold;
}

/* =========================
   TOOLBAR
========================= */

.toolbar {
    min-height: 43px;

    display: flex;
    align-items: center;

    gap: 5px;

    padding: 5px;

    border-bottom: 2px inset #eee;

    background: #c0c0c0;
}

.toolbar button {
    min-width: 55px;

   CONTENT

.chat-input button {

/* =========================

/* =========================

<script>

/* =====================================================
   STATE
===================================================== */

let suspicion =
    Number(
        localStorage.getItem(
            "catInternetSuspicion"
        ) || 0
    );

let history =
    ["cat://home"];

let historyIndex = 0;


/* =====================================================
   ELEMENTS
===================================================== */

const content =
    document.getElementById("content");

const address =
    document.getElementById("address");

const suspicionFill =
    document.getElementById("suspicionFill");

const suspicionText =
    document.getElementById("suspicionText");

const gameOver =
    document.getElementById("gameOver");


/* =====================================================
   SUSPICION
===================================================== */

function updateSuspicion() {

    suspicion =
        Math.max(
            0,
            Math.min(
                100,
                suspicion
            )
        );

    suspicionFill.style.width =
        suspicion + "%";

    suspicionText.textContent =
        suspicion + "%";

    localStorage.setItem(
        "catInternetSuspicion",
        String(suspicion)
    );

    if(suspicion >= 100) {

        triggerGameOver();

    }

}


function increaseSuspicion(amount) {

    suspicion += amount;

    updateSuspicion();

}


function triggerGameOver() {

    gameOver.classList.add("open");

}


function restartSimulator() {

    suspicion = 0;

    localStorage.setItem(
        "catInternetSuspicion",
        "0"
    );

    gameOver.classList.remove("open");

    showCatAI();

}


/* =====================================================
   NAVIGATION
===================================================== */

function setAddress(url) {

    address.value = url;

}


function navigate(url) {

    history =
        history.slice(
            0,
            historyIndex + 1
        );

    history.push(url);

    historyIndex =
        history.length - 1;

    setAddress(url);

}


function goBack() {

    if(historyIndex <= 0)
        return;

    historyIndex--;

    const url =
        history[historyIndex];

    setAddress(url);

    renderURL(url);

}


function goForward() {

    if(
        historyIndex >=
        history.length - 1
    )
        return;

    historyIndex++;

    const url =
        history[historyIndex];

    setAddress(url);

    renderURL(url);

}


function reloadPage() {

    renderURL(
        address.value
    );

}


function goAddress() {

    const url =
        address.value.trim();

    if(!url)
        return;

    navigate(url);

    renderURL(url);

}


function addressKey(event) {

    if(event.key === "Enter") {

        goAddress();

    }

}

    `;

/* =====================================================
   ADD CHAT MESSAGE
===================================================== */

function addCatMessage(
    text,
    type
) {

    const box =
        document.getElementById(
            "chatMessages"
        );

    if(!box)
        return;


    const message =
        document.createElement(
            "div"
        );


    message.className =
        "chat-message " +
        type;


    message.textContent =
        text;


    box.appendChild(
        message
    );


    box.scrollTop =
        box.scrollHeight;

}


/* =====================================================
   SEND TO REAL SERVER
===================================================== */

async function sendCatMessage() {

    const input =
        document.getElementById(
            "catInput"
        );


    if(!input)
        return;


    const text =
        input.value.trim();


    if(!text)
        return;


    addCatMessage(
        "You: " + text,
        "user"
    );


    input.value = "";


    addCatMessage(
        "🐈 Cat.AI is thinking...",
        "cat"
    );


    const chatBox =
        document.getElementById(
            "chatMessages"
        );


    try {

        const response =
            await fetch(
                "/api/chat",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            message:
                                text

                        })

                }
            );


        const data =
            await response.json();


        /* Remove thinking message */

        const messages =
            chatBox.querySelectorAll(
                ".chat-message"
            );


        const lastMessage =
            messages[
                messages.length - 1
            ];


        if(
            lastMessage &&
            lastMessage.textContent.includes(
                "thinking"
            )
        ) {

            lastMessage.remove();

        }


        /* Server error */

        if(!response.ok) {

            addCatMessage(
                "🐈 Cat.AI ERROR: " +
                (
                    data.error ||
                    "Something went wrong."
                ),
                "cat"
            );

            return;

        }


        /* Real Cat.AI reply */

        addCatMessage(
            "🐈 Cat.AI: " +
            data.reply,
            "cat"
        );


    } catch(error) {

        const messages =
            chatBox.querySelectorAll(
                ".chat-message"
            );


        const lastMessage =
            messages[
                messages.length - 1
            ];


        if(
            lastMessage &&
            lastMessage.textContent.includes(
                "thinking"
            )
        ) {

            lastMessage.remove();

        }


        addCatMessage(
            "🐈 Cat.AI ERROR: " +
            "Could not connect to the Cat Internet server.",
            "cat"
        );


        console.error(
            "Cat.AI connection error:",
            error
        );

    }

}

/* =====================================================
   FAKE CAT SEARCH
===================================================== */

function performSearch() {

    const input =
        document.getElementById(
            "searchInput"
        );


    const results =
        document.getElementById(
            "searchResults"
        );


    const query =
        input.value.trim();


    if(!query)
        return;


    setAddress(
        "cat://search/" +
        encodeURIComponent(query)
    );


    const lower =
        query.toLowerCase();


    if(
        lower.includes("human") ||
        lower.includes("person")
    ) {

        increaseSuspicion(10);

    }


    if(
        lower.includes("shoe") ||
        lower.includes("shoes")
    ) {

        increaseSuspicion(5);

    }


    results.innerHTML = `

        <h2>
            Search results for:
            "${escapeHTML(query)}"
        </h2>


        <div class="result">

            <a onclick="showCatAI()">
                Cat.AI
            </a>

}

/* =====================================================
   URL RENDERER
===================================================== */

function renderURL(url) {

    if(url === "cat://home") {

        renderHome();

        return;

    }


    if(url === "cat://cat.ai") {

        showCatAI();

        return;

    }


    if(url === "cat://search") {

        showSearch();

        return;

    }


    if(url === "cat://cats") {

        showCats();

        return;

    }


    if(url === "cat://news") {

        showNews();

        return;

    }


    if(url === "cat://about") {

        showAbout();

        return;

    }


    renderHome();

}


/* =====================================================
   HTML ESCAPING
===================================================== */

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        String(value);

    return div.innerHTML;

}
